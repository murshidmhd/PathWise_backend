name: PathWise Professional Deploy

on:
  push:
    branches: [ beta ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_DJANGO: murshidmhd/pathwise-django
  IMAGE_NAME_WS: murshidmhd/pathwise-websocket
  IMAGE_NAME_AI: murshidmhd/pathwise-ai-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Django Image
        uses: docker/build-push-action@v4
        with:
          context: ./django
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DJANGO }}:latest

      - name: Build and Push Websocket Image
        uses: docker/build-push-action@v4
        with:
          context: ./websocket
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WS }}:latest

      - name: Build and Push AI Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AI }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 52.66.53.143
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pathwise_backend
            git pull origin beta
            # Log in to GHCR on the EC2 server to pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pull latest images and restart
            sudo docker-compose -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f