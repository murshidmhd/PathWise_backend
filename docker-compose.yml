
services:

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro  # <--- ADD THIS LINE
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - websocket
      - ai-service
    restart: always

  django:
    # in here we build the image but in the case of the db we use aldreay exist one
    build: ./django
    ports:
      - "8000:8000"
    #environment:
     # DB_ENGINE: django.db.backends.postgresql
      #DB_NAME: career_db
     #DB_USER: career_user
    # DB_PASSWORD: 786786msyt
      #DB_HOST: db1
      #DB_PORT: 5432
      #REDIS_URL: redis://redis:6379/0
    #volumes:
     # - ./django:/app
    env_file: ./django/.env
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: always

  celery:
    build: ./django
    command: celery -A backend worker --loglevel=info
    env_file: ./django/.env
    restart: always
    depends_on:
      - redis
    volumes:
      - ./django:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json # And here!
    working_dir: /app
  websocket:
    build: ./websocket
    ports:
      - "8001:8001"
    env_file: ./websocket/.env
    restart: always
    depends_on:
      - redis
    volumes:
      - ./websocket:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json # Add this line here too!
    working_dir: /app
    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application
  ai-service:
    build: ./ai-service
    ports:
      - "8002:8002"
    env_file:
      - ./ai-service/.env
    restart: always
