upstream ai_service {
    server ai-service:8002;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pathwise.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# New block for subdomains on HTTP (No Redirect)
server {
    listen 80;
    server_name *.pathwise.duckdns.org;

    client_max_body_size 10M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://django;
    }

    location /api/ {
        proxy_pass http://django;
    }

    location /register-fcm/ {
        proxy_pass http://websocket;
    }

    location /api/chat/ {
        proxy_pass http://websocket;
    }
}

server {
    listen 443 ssl; 
    server_name pathwise.duckdns.org *.pathwise.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pathwise.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pathwise.duckdns.org/privkey.pem;

    # Allow file uploads up to 10MB (fixes 413 error on counselor certificate upload)
    client_max_body_size 10M;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- REMOVED MANUAL CORS FROM HERE TO AVOID DOUBLE HEADERS ---

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django:8000;
    }

    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ai/ {
        proxy_pass http://ai_service/;
    }
}
