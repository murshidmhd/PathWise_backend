upstream django {
    server django:8000;
}

upstream websocket {
    server websocket:8001;
}

upstream ai_service {
    server ai-service:8002;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pathwise.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl; 
    server_name pathwise.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pathwise.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pathwise.duckdns.org/privkey.pem;

    # Allow file uploads up to 10MB (fixes 413 error on counselor certificate upload)
    client_max_body_size 10M;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- REMOVED MANUAL CORS FROM HERE TO AVOID DOUBLE HEADERS ---

    location / {
        proxy_pass http://django;
    }

    location /api/ {
        proxy_pass http://django;
    }

    location /register-fcm/ {
        proxy_pass http://websocket;
    }

    location /api/chat/ {
        proxy_pass http://websocket;
    }

    location /ws/ {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        
        # Essential WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass the real host and IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin ""; # Bypasses some strict origin checks

        # Stability settings
        proxy_buffering off;
        proxy_redirect off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Ensure Nginx doesn't try to use HTTP/2 for the proxy connection
        proxy_set_header Proxy "";
    }

    location /ai/ {
        proxy_pass http://ai_service/;
    }
}
