upstream django {
    server django:8000;
}

upstream websocket {
    server websocket:8001;
}

upstream ai_service {
    server ai-service:8002;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pathwise.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl; 
    server_name pathwise.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pathwise.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pathwise.duckdns.org/privkey.pem;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS Headers for Vercel
    add_header 'Access-Control-Allow-Origin' 'https://path-wise-frontend.vercel.app' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-CSRFToken' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://django;
    }

    location /api/ {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://django;
    }

    location /api/chat/ {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://websocket;
    }

    location /ws/ {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ai/ {
        proxy_pass http://ai_service/;
    }
}
