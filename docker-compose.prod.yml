services:
  # --- REVERSE PROXY (NGINX) ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
    depends_on:
      - django
      - ai-service
    restart: always

  db1:
    image: postgres:15
    container_name: pathwise_db_1
    restart: always
    environment:
      - POSTGRES_DB=pathwise-db
      - POSTGRES_USER=pathwise_admin
      - POSTGRES_PASSWORD=b6q89ZUBYPnTQ3r
    ports:
      - "5432:5432"
    volumes:
      - db1_data:/var/lib/postgresql/data


  # --- MAIN DJANGO API ---
  django:
    image: ghcr.io/murshidmhd/pathwise-django:latest
    ports:
      - "8000:8000"
    env_file:
      - ./django/.env
    volumes:
      - static_volume:/app/staticfiles
      - ./django/firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - redis
      - db1
    restart: always

  # --- CELERY WORKER ---
  celery:
    image: ghcr.io/murshidmhd/pathwise-django:latest
    command: celery -A backend worker --loglevel=info
    env_file:
      - ./django/.env
    volumes:
      - ./django/firebase-credentials.json:/app/firebase-credentials.json
    working_dir: /app
    depends_on:
      - redis
      - db1
    restart: always

  # --- CELERY BEAT ---
  celery-beat:
    image: ghcr.io/murshidmhd/pathwise-django:latest
    command: celery -A backend beat --loglevel=info
    env_file:
      - ./django/.env
    volumes:
      - static_volume:/app/staticfiles
      - ./django/firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - redis
      - db1
    restart: always


  # --- AI SERVICE (FASTAPI) ---
  ai-service: 
    image: ghcr.io/murshidmhd/pathwise-ai-service:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    env_file:
      - ./ai-service/.env
    # No volumes needed as code is in image
    restart: always

  # --- INFRASTRUCTURE --- 
  redis:
    image: redis:7
    restart: always

volumes:
  static_volume:
  db1_data:
